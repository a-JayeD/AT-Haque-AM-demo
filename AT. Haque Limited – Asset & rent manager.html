<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AT. Haque Limited – Asset &amp; rent manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #EDF0F6;
            --card: #fff;
            --ink: #14213D;
            --mut: #667085;
            --line: #E2E7F0;
            --soft: #F4F6FB;
            --nav: #0D1A33;
            --gold: #D9A441;
            --ok: #12A072;
            --part: #E39325;
            --bad: #E5484D;
            --clm: #6E56CF;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0A101D;
                --card: #121B2E;
                --ink: #E8ECF4;
                --mut: #93A0B8;
                --line: #22304A;
                --soft: #17223A
            }
        }

        :root[data-theme="dark"] {
            --bg: #0A101D;
            --card: #121B2E;
            --ink: #E8ECF4;
            --mut: #93A0B8;
            --line: #22304A;
            --soft: #17223A
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
            font-variant-numeric: tabular-nums
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            display: grid;
            grid-template-columns: 248px 1fr;
            min-height: 100vh
        }

        .side {
            background: var(--nav);
            color: #C9D3E8;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            height: 100vh;
            align-self: start
        }

        .logo {
            display: flex;
            gap: 11px;
            align-items: center;
            padding: 0 8px 22px;
            color: #fff
        }

        .logo b {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--gold);
            color: #0D1A33;
            font-weight: 800;
            font-size: 15px
        }

        .logo span {
            font-weight: 700;
            line-height: 1.2
        }

        .logo small {
            display: block;
            font-weight: 400;
            color: #8FA0C2;
            font-size: 12px
        }

        .nav button {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            border: 0;
            background: none;
            color: inherit;
            padding: 11px 12px;
            border-radius: 10px;
            text-align: left;
            font-weight: 500
        }

        .nav button:hover {
            background: #16264A
        }

        .nav button.on {
            background: #1B2F5B;
            color: #fff;
            box-shadow: inset 3px 0 var(--gold)
        }

        .nav svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .nav em {
            margin-left: auto;
            font-style: normal;
            background: var(--clm);
            color: #fff;
            border-radius: 20px;
            padding: 0 8px;
            font-size: 12px;
            font-weight: 700
        }

        .who2 {
            margin-top: auto;
            padding: 12px;
            border-radius: 12px;
            background: #12234A
        }

        .who2 label {
            font-size: 12px;
            color: #8FA0C2
        }

        .who2 select {
            width: 100%;
            margin-top: 4px;
            background: #0D1A33;
            border: 1px solid #2A3E6B;
            color: #fff;
            border-radius: 8px;
            padding: 7px
        }

        main {
            padding: 24px 32px 48px;
            min-width: 0
        }

        .top {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap
        }

        .top h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -.02em;
            flex: 1;
            min-width: 200px
        }

        .top input {
            width: 280px;
            max-width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card)
        }

        .pill {
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--mut);
            font-size: 13px
        }

        .hero {
            background: var(--nav);
            color: #fff;
            border-radius: 20px;
            padding: 28px 32px;
            display: grid;
            grid-template-columns: auto 1fr 1.1fr;
            gap: 34px;
            align-items: center;
            margin-bottom: 22px
        }

        .ring {
            position: relative;
            width: 150px;
            height: 150px
        }

        .ring svg {
            transform: rotate(-90deg)
        }

        .ring div {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center
        }

        .ring b {
            font-size: 30px;
            line-height: 1
        }

        .ring small {
            color: #8FA0C2;
            font-size: 12px
        }

        .hero h2 {
            margin: 0 0 4px;
            font-size: 15px;
            font-weight: 500;
            color: #8FA0C2
        }

        .big {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.1
        }

        .hk {
            display: flex;
            gap: 26px;
            margin-top: 16px;
            flex-wrap: wrap
        }

        .hk div {
            font-size: 12px;
            color: #8FA0C2
        }

        .hk b {
            display: block;
            font-size: 17px;
            color: #fff
        }

        .trend {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            height: 120px
        }

        .trend div {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            height: 100%;
            font-size: 11px;
            color: #8FA0C2
        }

        .trend i {
            display: block;
            width: 100%;
            border-radius: 6px 6px 2px 2px;
            background: #223A6B;
            position: relative;
            min-height: 4px
        }

        .trend i u {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 6px 6px 2px 2px;
            background: var(--gold)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px
        }

        .cat {
            cursor: pointer;
            transition: transform .15s, border-color .15s
        }

        .cat:hover {
            transform: translateY(-2px);
            border-color: var(--gold)
        }

        .cat h3 {
            margin: 0;
            font-size: 16px
        }

        .cat small,
        .mut {
            color: var(--mut)
        }

        .cat .v {
            font-size: 22px;
            font-weight: 800;
            margin: 12px 0 10px;
            letter-spacing: -.02em
        }

        .bar {
            height: 8px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--bad) 28%, var(--soft));
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ok);
            border-radius: 8px
        }

        .row2 {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 8px;
            color: var(--mut)
        }

        .row2 b {
            color: var(--ink)
        }

        .sec {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 22px
        }

        h3.t {
            margin: 0 0 12px;
            font-size: 16px
        }

        .li {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--line)
        }

        .li:first-of-type {
            border-top: 0
        }

        .li>div:nth-child(2) {
            flex: 1;
            min-width: 0
        }

        .li b {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .kp {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 18px
        }

        .kp .card b {
            display: block;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .kp span {
            color: var(--mut);
            font-size: 12px
        }

        .bar2 {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .fl {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: 500
        }

        .fl.on {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink)
        }

        .back {
            border: 0;
            background: none;
            color: var(--mut);
            padding: 0;
            margin-bottom: 6px;
            font-weight: 600
        }

        .tw {
            overflow-x: auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px
        }

        th {
            font-size: 12px;
            color: var(--mut);
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            background: var(--soft)
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid var(--line)
        }

        tbody tr {
            cursor: pointer
        }

        tbody tr:hover {
            background: var(--soft)
        }

        .r {
            text-align: right
        }

        .warn {
            color: var(--part);
            font-weight: 700
        }

        .empty {
            text-align: center;
            color: var(--mut);
            padding: 30px
        }

        .who {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .who small {
            display: block;
            color: var(--mut);
            font-size: 12px
        }

        .av {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            font-style: normal;
            font-weight: 700;
            font-size: 13px;
            flex: none
        }

        .chip {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .chip.paid {
            background: #12A07220;
            color: var(--ok)
        }

        .chip.part {
            background: #E3932520;
            color: var(--part)
        }

        .chip.due {
            background: #E5484D20;
            color: var(--bad)
        }

        .chip.claim {
            background: #6E56CF22;
            color: var(--clm)
        }

        .chip.exp {
            background: var(--soft);
            color: var(--mut)
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--card);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600
        }

        .btn.p {
            background: var(--nav);
            color: #fff;
            border-color: var(--nav)
        }

        .btn.g {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok)
        }

        .btn.x {
            color: var(--bad)
        }

        .btn:hover {
            filter: brightness(1.08)
        }

        .dr {
            position: fixed;
            inset: 0 0 0 auto;
            width: min(560px, 100%);
            background: var(--card);
            border-left: 1px solid var(--line);
            box-shadow: -20px 0 50px #0004;
            transform: translateX(105%);
            transition: transform .25s;
            z-index: 20;
            overflow-y: auto;
            padding: 24px
        }

        .dr.o {
            transform: none
        }

        .sh {
            position: fixed;
            inset: 0;
            background: #0007;
            z-index: 15;
            display: none
        }

        .sh.o {
            display: block
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--line);
            margin: 18px 0
        }

        .tabs button {
            border: 0;
            background: none;
            padding: 9px 12px;
            font-weight: 600;
            color: var(--mut);
            border-bottom: 2px solid transparent
        }

        .tabs button.on {
            color: var(--ink);
            border-color: var(--gold)
        }

        .kv {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 18px
        }

        .kv span {
            display: block;
            font-size: 12px;
            color: var(--mut)
        }

        .kv b {
            font-weight: 600
        }

        .box {
            background: var(--soft);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px
        }

        .box h4 {
            margin: 0 0 10px;
            font-size: 13px
        }

        .ln {
            display: flex;
            justify-content: space-between;
            padding: 4px 0
        }

        .ln.tot {
            border-top: 1px dashed var(--line);
            margin-top: 6px;
            padding-top: 8px;
            font-weight: 800
        }

        .tl {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl span {
            padding: 6px 10px;
            border-radius: 8px;
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 12px
        }

        .tl span.d {
            background: var(--nav);
            color: #fff;
            border-color: var(--nav)
        }

        .docs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .doc {
            aspect-ratio: 3/4;
            border-radius: 10px;
            border: 1px dashed var(--mut);
            display: grid;
            place-items: center;
            text-align: center;
            font-size: 12px;
            color: var(--mut);
            background: repeating-linear-gradient(0deg, var(--soft) 0 10px, transparent 10px 20px);
            padding: 6px
        }

        .note {
            border-left: 3px solid var(--gold);
            padding: 6px 12px;
            margin-bottom: 10px;
            background: var(--soft);
            border-radius: 0 8px 8px 0;
            font-size: 13px
        }

        .note small {
            color: var(--mut);
            display: block
        }

        .md {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            background: #000a;
            z-index: 30;
            padding: 16px
        }

        .md.o {
            display: grid
        }

        .md>div {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            width: min(460px, 100%);
            max-height: 92vh;
            overflow: auto
        }

        .md h3 {
            margin: 0 0 14px
        }

        .md label {
            display: block;
            font-size: 12px;
            color: var(--mut);
            margin-top: 10px
        }

        .md input,
        .md textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg)
        }

        .err {
            color: var(--bad);
            font-size: 12px;
            min-height: 16px
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 40px);
            background: var(--ink);
            color: var(--bg);
            padding: 11px 18px;
            border-radius: 12px;
            opacity: 0;
            transition: .25s;
            z-index: 40;
            font-weight: 600
        }

        .toast.o {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        @media(max-width:1000px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: left
            }

            .sec {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:860px) {
            .app {
                grid-template-columns: 64px 1fr
            }

            .side {
                padding: 16px 8px
            }

            .logo span,
            .nav span,
            .who2 {
                display: none
            }

            .nav button {
                justify-content: center;
                padding: 12px
            }

            .nav em {
                position: absolute;
                margin: -22px 0 0 20px
            }

            main {
                padding: 18px 14px 40px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

        #tn {
            min-height: 100vh
        }

        .th {
            background: var(--nav);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .th .logo {
            padding: 0
        }

        .th select {
            background: #0D1A33;
            border: 1px solid #2A3E6B;
            color: #fff;
            border-radius: 8px;
            padding: 7px;
            max-width: 210px
        }

        .tc {
            max-width: 1020px;
            margin: 0 auto;
            padding: 28px 16px 56px
        }

        .tav {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--gold) center/cover;
            color: #0D1A33;
            display: grid;
            place-items: center;
            font-weight: 800;
            border: 2px solid #fff4;
            cursor: pointer;
            padding: 0
        }

        .tgrid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 16px;
            align-items: start
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .stat .big {
            font-size: 30px
        }

        .nt2 {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--soft);
            margin-bottom: 8px
        }

        .nt2 i {
            width: 4px;
            border-radius: 4px;
            background: var(--part);
            flex: none
        }

        .nt2.bad i {
            background: var(--bad)
        }

        .nt2.ok i {
            background: var(--clm)
        }

        .nt2 small {
            display: block;
            color: var(--mut)
        }

        .prog {
            height: 8px;
            border-radius: 8px;
            background: var(--soft);
            overflow: hidden;
            margin: 6px 0 14px
        }

        .prog i {
            display: block;
            height: 100%;
            background: var(--nav);
            border-radius: 8px
        }

        .md select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg)
        }

        @media(max-width:860px) {
            .tgrid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="logo"><b>AT</b><span>AT. Haque Limited<small>Asset &amp; rent manager</small></span></div>
            <nav class="nav" id="nav"></nav>
            <div class="who2"><label>Signed in as</label><select id="role" onchange="setRole(this.value)">
                    <option value="super">Super admin</option>
                    <option value="admin">Admin</option>
                    <option value="tenant">Tenant portal (demo)</option>
                </select></div>
        </aside>
        <main>
            <div class="top">
                <h1 id="ttl"></h1><input id="q" placeholder="Search tenant, category or unit"
                    oninput="q=this.value.toLowerCase();if(view!='cat')view='tenants';cat=view=='cat'?cat:null;render()"><button
                    class="btn p" onclick="setRole('tenant')">Open tenant portal</button><span class="pill">Demo date:
                    18 Nov 2026</span>
            </div>
            <div id="main"></div>
        </main>
    </div>
    <div class="sh" id="sh" onclick="closeT()"></div>
    <aside class="dr" id="dr"></aside>
    <div class="md" id="md">
        <div id="mb"></div>
    </div>
    <div id="tn" hidden></div><input type="file" id="pf" accept="image/*" hidden onchange="pimg(this)">

<div><h2>Six-month collection</h2><div class="trend">${tr.map(t => `<div><i style="height:${t.a / mx * 88}%"><u style="height:${t.a ? t.b / t.a * 100 : 0}%"></u></i>${MON[new Date(2026, 10 - t.k, 1).getMonth()]}</div>`).join('')}</div></div></div>
<h3 class="t">Categories</h3><div class="grid">${cats().map(({ c, s }) => `<div class="card cat" onclick="cat='${c}';view='cat';flt='all';render()"><h3>${esc(c)}</h3><small>${s.n} agreements · ${s.a} active</small><div class="v">${cr(s.recv)}<span class="mut" style="font-size:12px;font-weight:500"> / month</span></div><div class="bar"><i style="width:${s.recv ? s.paid / s.recv * 100 : 0}%"></i></div><div class="row2"><span>Paid <b>${cr(s.paid)}</b></span><span>Due <b>${cr(s.out)}</b></span></div></div>`).join('')}</div>
<div class="sec"><div class="card"><h3 class="t">Claims awaiting approval</h3>${cl.map(x => `<div class="li">${av(x)}<div><b>${esc(x.t)}</b><span class="mut">${esc(x.c)}</span></div><b>${fmt(x.n)}</b></div>`).join('') || '<span class="mut">All caught up.</span>'}<button class="btn" style="margin-top:10px" onclick="go('approvals')">Review all</button></div>
<div class="card"><h3 class="t">Agreements ending soon</h3>${ex.map(x => `<div class="li" style="cursor:pointer" onclick="openT(${x.i})">${av(x)}<div><b>${esc(x.t)}</b><span class="mut">${esc(x.c)}</span></div><b class="warn">${left(x)} days</b></div>`).join('')}<button class="btn" style="margin-top:10px" onclick="go('expiry')">Manage renewals</button></div></div>`
        }
        function catV() { const L = D.filter(x => x.c == cat), S = stats(L); return `<button class="back" onclick="go('dash')">‹ All categories</button><div class="kp"><div class="card"><span>Monthly rent</span><b>${cr(S.recv)}</b></div><div class="card"><span>Collected</span><b>${cr(S.paid)}</b></div><div class="card"><span>Total outstanding</span><b>${cr(S.out)}</b></div><div class="card"><span>Tenants</span><b>${S.n}</b></div></div>${filters()}${tbl(fl(L), 0)}` }
        function approvals() { const L = D.filter(x => act(x) && led(x)[0].st == 'claim'), m = ['Bank transfer', 'Cheque', 'Cash to MD']; return L.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${L.map(x => `<div class="card"><div class="who">${av(x)}<div><b>${esc(x.t)}</b><small>${esc(x.c + ' · ' + x.u)}</small></div></div><div class="big" style="font-size:26px;margin:14px 0 4px">${fmt(x.n)}</div><div class="mut" style="margin-bottom:12px">${ov[x.i + '_0']?.method || m[hs(x.i) % 3]} · ${ov[x.i + '_0']?.note ? esc(ov[x.i + '_0'].note) : 'proof attached'}</div>${ov[x.i + '_0']?.img ? `<img alt="Payment proof" src="${ov[x.i + '_0'].img}" style="max-width:100%;max-height:130px;border-radius:8px;margin-bottom:12px">` : ''}<button class="btn g" onclick="decide(${x.i},1)">Approve</button> <button class="btn x" onclick="decide(${x.i},0)">Reject</button> <button class="btn" onclick="openT(${x.i})">Details</button></div>`).join('')}</div>` : '<div class="card empty">No pending claims. New tenant claims appear here with their proof.</div>' }
        function decide(id, ok) { const x = byId(id), m = led(x)[0]; ov[id + '_0'] = ok ? { paid: m.due, st: 'paid' } : { paid: 0, st: 'due' }; log(x, (ok ? 'Approved' : 'Rejected') + ' payment claim of ' + fmt(m.due)); toast(ok ? 'Claim approved' : 'Claim rejected'); render() }
        function log(x, t, n) { const e = { t, n, by: role == 'super' ? 'Farhana Haque' : 'Tanvir Ahmed', at: '18 Nov 2026' }; x.nt.unshift(e); audit.unshift({ ...e, w: x.t }) }
        function expiry() { const g = [['Ended', x => left(x) < 0], ['Within 10 days', x => left(x) >= 0 && left(x) <= 10], ['Within 4 months', x => left(x) > 10 && left(x) <= 120]]; return g.map(([n, f]) => { const L = D.filter(f).sort((a, b) => left(b) - left(a)); return `<h3 class="t" style="margin-top:18px">${n} <span class="mut">(${L.length})</span></h3><div class="tw"><table><tbody>${L.slice(0, n == 'Ended' ? 8 : 99).map(x => `<tr onclick="openT(${x.i})"><td><div class="who">${av(x)}<div><b>${esc(x.t)}</b><small>${esc(x.c + ' · ' + x.u)}</small></div></div></td><td>Ends ${dt(x.e)}</td><td class="r ${left(x) <= 10 ? 'warn' : ''}">${left(x) < 0 ? 'Ended' : left(x) + ' days'}</td><td class="r" onclick="event.stopPropagation()"><button class="btn" onclick="alertT(${x.i})">Send alert</button> <button class="btn p" onclick="renewM(${x.i})">Renew</button></td></tr>`).join('')}</tbody></table></div>${n == 'Ended' && L.length > 8 ? `<p class="mut">Showing 8 of ${L.length} ended agreements. Search above to find others.</p>` : ''}` }).join('') }
        function team() { return `<div class="card"><h3 class="t">Admins</h3>${admins.map((a, i) => `<div class="li"><i class="av" style="background:hsl(${i * 70 + 200} 45% 38%)">${a[0][0]}</i><div><b>${esc(a[0])}</b><span class="mut">${a[1]}</span></div>${a[1] == 'Admin' ? `<button class="btn x" onclick="admins.splice(${i},1);toast('Admin removed');render()">Remove</button>` : ''}</div>`).join('')}<button class="btn p" style="margin-top:12px" onclick="addM()">Add admin</button></div><p class="mut">Only a super admin can add or remove admins. Switch the role at the bottom of the sidebar to see this page disappear for an admin.</p>` }
        function addM() { modal(`<h3>Add admin</h3><label>Full name</label><input id="an"><label>Email</label><input id="ae"><p class="err" id="er"></p><button class="btn p" onclick="addA()">Create admin</button>`) }
        function addA() { const n = $('#an').value.trim(); if (!n) { $('#er').textContent = 'Enter the admin’s name.'; return } admins.push([n, 'Admin']); closeM(); toast('Admin added'); render() }
        function openT(id) { sel = id; tab = 'ov'; drawer() }
        function closeT() { sel = null; $('#dr').classList.remove('o'); $('#sh').classList.remove('o') }
        function drawer() {
            const x = byId(sel), L = led(x), m = L[0], s = st(x), meth = ['Bank transfer', 'Cheque', 'Cash to MD'][hs(x.i) % 3];
            const steps = x.ev && x.pc ? [...Array(7).keys()].map(k => ({ k, d: new Date(x.sd.getFullYear() + k * x.ev, x.sd.getMonth(), x.sd.getDate()), a: x.d * Math.pow(1 + x.pc, k) })).filter(z => z.d <= x.ed) : [];
            const body = {
                ov: `<div class="box"><div class="kv"><div><span>Agreement</span><b>${dt(x.s)} – ${dt(x.e)}</b></div><div><span>Time left</span><b>${left(x) < 0 ? 'Ended' : left(x) + ' days'}</b></div><div><span>Rent area</span><b>${x.a.toLocaleString('en-IN')} sqft</b></div><div><span>Contact</span><b>${esc(x.p || 'Not on file')}</b></div><div><span>Deed rent</span><b>${fmt(x.d)}</b></div><div><span>Paper type</span><b>${esc(x.ty || 'Not recorded')}</b></div></div></div>
<div class="box"><h4>Monthly rent breakdown</h4><div class="ln"><span>Current rent</span><b>${fmt(x.g)}</b></div><div class="ln"><span>Advance adjusted</span><b>− ${fmt(x.aj)}</b></div><div class="ln"><span>AIT (editable)</span><b>− ${fmt(x.ait)}</b></div><div class="ln tot"><span>Receivable</span><span>${fmt(x.n)}</span></div></div>
<div class="box"><h4>Advance</h4><div class="kv"><div><span>Advance received</span><b>${fmt(x.ad)}</b></div><div><span>Security deposit</span><b>${fmt(x.sec)}</b></div><div><span>Refundable</span><b>${fmt(Math.max(0, x.ad - x.sec))}</b></div><div><span>Payment method</span><b>${meth}</b></div></div></div>
<div class="box"><h4>Rent escalation${x.ev && x.pc ? ` · ${Math.round(x.pc * 1000) / 10}% every ${x.ev} yrs` : ''}</h4>${steps.length ? `<div class="tl">${steps.map(z => `<span class="${z.d <= T ? 'd' : ''}">${z.d.getFullYear()} · ${fmt(z.a)}</span>`).join('')}</div>` : '<span class="mut">No fixed escalation recorded.</span>'}</div>`,
                pay: `<div class="tw"><table style="min-width:0"><thead><tr><th>Month</th><th class="r">Rent</th><th class="r">Paid</th><th>Status</th></tr></thead><tbody>${L.filter(Boolean).map(r => `<tr style="cursor:auto"><td>${r.lb}</td><td class="r">${fmt(r.due)}</td><td class="r">${fmt(r.paid)}</td><td>${chip(r.st)}</td></tr>`).join('')}</tbody></table></div><p class="mut">Payment history is simulated for this demo; the file has no payment records yet.</p>`,
                doc: `<div class="docs">${['Agreement paper', 'Deed', 'Advance receipt', 'Adjustment slip', 'Payment proof', 'Renewal paper'].map(n => `<div class="doc">${n}<br>Click to upload</div>`).join('')}</div>`,
                nt: `<button class="btn" onclick="noteM(${x.id || x.i})">Add note</button><div style="margin-top:12px">${x.nt.map(n => `<div class="note">${esc(n.t)}${n.n ? '<br><i>“' + esc(n.n) + '”</i>' : ''}<small>${n.by} · ${n.at}</small></div>`).join('') || '<span class="mut">No notes or changes recorded yet.</span>'}</div>`
            }[tab];
            $('#dr').innerHTML = `<div class="who">${av(x)}<div style="flex:1"><b style="font-size:18px">${esc(x.t)}</b><small>${esc(x.c + ' · ' + x.u)}</small></div>${chip(s)}<button class="btn" onclick="closeT()" aria-label="Close">✕</button></div>
<div class="bar2" style="margin:16px 0 0">${s != 'exp' && m.paid < m.due ? `<button class="btn g" onclick="markPaid(${x.i})">Mark ${fmt(m.due - m.paid)} paid</button>` : ''}<button class="btn" onclick="alertT(${x.i})">Send alert</button><button class="btn" onclick="editM(${x.i})">Edit terms</button><button class="btn p" onclick="renewM(${x.i})">Renew</button></div>
<div class="tabs">${[['ov', 'Overview'], ['pay', 'Payments'], ['doc', 'Documents'], ['nt', 'Notes']].map(([k, n]) => `<button class="${tab == k ? 'on' : ''}" onclick="tab='${k}';drawer()">${n}</button>`).join('')}</div>${body}`;
            $('#dr').classList.add('o'); $('#sh').classList.add('o')
        }
        function markPaid(id) { const x = byId(id), m = led(x)[0]; ov[id + '_0'] = { paid: m.due, st: 'paid' }; log(x, 'Marked November rent as paid (' + fmt(m.due) + ')'); toast('Payment recorded'); render() }
        function alertT(id) { const x = byId(id); log(x, 'Alert sent to tenant and admins'); toast('Alert sent to ' + x.t); if (sel) drawer() }
        function modal(h) { $('#mb').innerHTML = h; $('#md').classList.add('o') } function closeM() { $('#md').classList.remove('o') }
        function noteM(id) { modal(`<h3>Add note</h3><label>Note</label><textarea id="nt" rows="3"></textarea><p class="err" id="er"></p><button class="btn p" onclick="saveN(${id})">Save note</button>`) }
        function saveN(id) { const v = $('#nt').value.trim(); if (!v) { $('#er').textContent = 'Write a note before saving.'; return } log(byId(id), 'Note added', v); closeM(); drawer() }
        function editM(id) { const x = byId(id), f = (k, l, v) => `<label>${l}</label><input id="f_${k}" type="number" value="${v}">`; modal(`<h3>Edit terms · ${esc(x.t)}</h3>${f('g', 'Current rent (৳)', x.g)}${f('aj', 'Advance adjusted (৳)', x.aj)}${f('ait', 'AIT (৳)', x.ait)}${f('sec', 'Security deposit (৳)', x.sec)}<label>Reason for change (required)</label><textarea id="nt" rows="2"></textarea><p class="err" id="er"></p><button class="btn p" onclick="saveE(${id})">Save change</button>`) }
        function saveE(id) { const x = byId(id), v = $('#nt').value.trim(); if (!v) { $('#er').textContent = 'A note is required for rent and advance changes.'; return } ['g', 'aj', 'ait', 'sec'].forEach(k => x[k] = +$('#f_' + k).value || 0); x.n = x.g - x.aj - x.ait; log(x, 'Terms edited: rent ' + fmt(x.g) + ', receivable ' + fmt(x.n), v); closeM(); toast('Change saved with note'); render() }
        function renewM(id) { const x = byId(id); modal(`<h3>Renew agreement · ${esc(x.t)}</h3><label>New end date</label><input id="rd" type="date" value="${x.ed.getFullYear() + (x.ed < T ? 6 : 0) + 3}-${String(x.ed.getMonth() + 1).padStart(2, '0')}-${String(x.ed.getDate()).padStart(2, '0')}"><label>New agreement paper</label><input type="file"><label>Note</label><textarea id="nt" rows="2"></textarea><p class="err" id="er"></p><button class="btn p" onclick="saveR(${id})">Renew agreement</button>`) }
        function saveR(id) { const x = byId(id), v = $('#rd').value; if (!v) { $('#er').textContent = 'Choose the new end date.'; return } x.e = v; x.ed = new Date(v); log(x, 'Agreement renewed until ' + dt(v), $('#nt').value.trim()); closeM(); toast('Agreement renewed'); render() }
        $('#md').onclick = e => { if (e.target.id == 'md') closeM() }; document.onkeydown = e => { if (e.key == 'Escape') { closeM(); closeT() } };
        const tnames = [...new Set(D.map(x => x.t))].sort(), tn = { name: 'Popular Pharmaceuticals Ltd.', ai: 0, img: null }; let prev = 'super';
        const mine = () => D.filter(x => x.t == tn.name), ini = n => n.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(), err = m => $('#er').textContent = m;
        function setRole(r) { if (r == 'tenant' && role != 'tenant') prev = role; role = r; const t = r == 'tenant'; $('.app').style.display = t ? 'none' : ''; $('#tn').hidden = !t; closeT(); if (t) trender(); else { $('#role').value = r; if (r != 'super' && view == 'team') view = 'dash'; render() } }
        function notif(L) { const n = []; L.forEach(x => { const l = left(x), w = x.u + ' · ' + x.c; if (l < 0) n.push(['bad', 'Agreement ended on ' + dt(x.e), w + '. Renew to keep your space.']); else if (l <= 10) n.push(['bad', 'Agreement ends in ' + l + ' days', w + ' · final 10-day notice']); else if (l <= 120) n.push(['warn', 'Agreement ends in ' + l + ' days', w + ' · 4-month notice, start your renewal']); x.nt.filter(e => /^(Alert|Approved|Rejected|Marked|Agreement renewed)/.test(e.t)).slice(0, 2).forEach(e => n.push(['ok', e.t.replace('Alert sent to tenant and admins', 'Payment reminder from AT. Haque'), e.at])) }); return n }
        function trender() {
            const L = mine(), S = stats(L); if (!L.some(x => x.i == tn.ai)) tn.ai = (L.find(act) || L[0]).i; const x = byId(tn.ai), a = act(x), m = a ? led(x)[0] : null, l = left(x), pr = Math.min(100, Math.max(0, (T - x.sd) / (x.ed - x.sd) * 100)), nf = notif(L); let nx = null; if (x.ev && x.pc) for (let k = 1; k < 8; k++) { const d = new Date(x.sd.getFullYear() + k * x.ev, x.sd.getMonth(), x.sd.getDate()); if (d > T && d <= x.ed) { nx = [d, x.d * Math.pow(1 + x.pc, k)]; break } }
            const act2 = !m ? chip('exp') : m.st == 'due' || m.st == 'part' ? `<button class="btn p" onclick="claimM()">Claim a payment</button>` : chip(m.st);
            $('#tn').innerHTML = `<header class="th"><div class="logo"><b>AT</b><span>AT. Haque Limited<small>Tenant portal</small></span></div><span style="flex:1"></span><select aria-label="Demo tenant" onchange="tn.name=this.value;tn.ai=0;trender()">${tnames.map(n => `<option ${n == tn.name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><button class="btn" onclick="pwM()">Password</button><button class="btn" onclick="setRole(prev)">Admin view</button><button class="tav" aria-label="Change profile photo" title="Change profile photo" style="${tn.img ? `background-image:url(${tn.img})` : ''}" onclick="$('#pf').click()">${tn.img ? '' : ini(tn.name)}</button></header>
<div class="tc"><h1 style="margin:0;font-size:26px;letter-spacing:-.02em">Hello, ${esc(tn.name)}</h1><p class="mut" style="margin:4px 0 20px">Your rent status for November 2026.</p>
<div class="kp"><div class="card"><span>Current monthly rent</span><b>${fmt(S.recv)}</b></div><div class="card"><span>Paid this month</span><b style="color:var(--ok)">${fmt(S.paid)}</b></div><div class="card"><span>Total due rent</span><b style="color:${S.out ? 'var(--bad)' : 'var(--ok)'}">${fmt(S.out)}</b></div></div>
<div class="tgrid"><div>${L.length > 1 ? `<div class="bar2">${L.map(y => `<button class="fl ${y.i == tn.ai ? 'on' : ''}" onclick="tn.ai=${y.i};trender()">${esc(y.c + ' · ' + y.u)}</button>`).join('')}</div>` : ''}
<div class="card"><div class="stat"><div><span class="mut">${esc(x.c + ' · ' + x.u)}</span><div class="big">${m ? fmt(m.due - m.paid) : '–'}</div><span class="mut">${m ? (m.paid ? 'left to pay of ' + fmt(m.due) : 'due for ' + m.lb) : 'No rent due on this agreement'}</span></div>${act2}</div>${m && m.st == 'claim' ? '<div class="note">Your claim is waiting for admin approval.</div>' : ''}
<div class="box"><div class="ln"><span>Current rent</span><b>${fmt(x.g)}</b></div><div class="ln"><span>Advance adjusted</span><b>− ${fmt(x.aj)}</b></div><div class="ln"><span>AIT</span><b>− ${fmt(x.ait)}</b></div><div class="ln tot"><span>You pay</span><span>${fmt(x.n)}</span></div></div>
<div class="kv"><div><span>Agreement starts</span><b>${dt(x.s)}</b></div><div><span>Agreement ends</span><b>${dt(x.e)}</b></div><div><span>Rent area</span><b>${x.a.toLocaleString('en-IN')} sqft</b></div><div><span>Next rent increase</span><b>${nx ? dt(nx[0]) + ' → ' + fmt(nx[1]) : 'None scheduled'}</b></div></div>
<div class="prog" title="${Math.round(pr)}% of term used"><i style="width:${pr}%"></i></div><div class="mut" style="margin:-8px 0 14px">${l < 0 ? 'Ended ' + (-l) + ' days ago' : l + ' days left in this agreement'}</div>${l <= 120 ? `<button class="btn p" onclick="renewT()">Request renewal</button>` : ''}</div>
<div class="card" style="margin-top:16px"><h3 class="t">Agreement papers</h3><div class="docs"><div class="doc" onclick="toast('Demo: opens the uploaded image')">Agreement paper<br>${esc(x.ty || 'Original')}</div><div class="doc" onclick="toast('Demo: opens the uploaded image')">Deed</div><div class="doc" onclick="toast('Demo: opens the uploaded image')">Advance receipt</div></div></div>
<div class="card" style="margin-top:16px"><h3 class="t">Payment history</h3>${led(x).filter(Boolean).map(r => `<div class="li"><div><b>${r.lb}</b><span class="mut">${fmt(r.paid)} of ${fmt(r.due)}</span></div>${chip(r.st)}</div>`).join('') || '<span class="mut">No payments recorded.</span>'}</div></div>
<div><div class="card"><h3 class="t">Notifications</h3>${nf.map(n => `<div class="nt2 ${n[0]}"><i></i><div><b>${esc(n[1])}</b><small>${esc(n[2])}</small></div></div>`).join('') || '<span class="mut">Nothing new.</span>'}</div></div></div></div>`
        }
        function claimM() { const x = byId(tn.ai), m = led(x)[0]; modal(`<h3>Claim a payment</h3><div class="mut">${fmt(m.due - m.paid)} outstanding for ${m.lb}</div><label>Amount paid (৳)</label><input id="ca" type="number" value="${m.due - m.paid}"><label>Payment method</label><select id="cm"><option>Bank transfer</option><option>Cheque</option><option>Cash to MD</option></select><label>Note</label><textarea id="cn" rows="2" placeholder="Transaction reference or details"></textarea><label>Proof (image)</label><input id="ci" type="file" accept="image/*"><p class="err" id="er"></p><button class="btn p" onclick="claimS()">Send claim</button>`) }
        function claimS() {
            const x = byId(tn.ai), m = led(x)[0], a = +$('#ca').value, n = $('#cn').value.trim(), f = $('#ci').files[0]; if (!(a > 0)) { err('Enter the amount you paid.'); return } if (!n && !f) { err('Add a note or a proof image.'); return }
            const fin = img => { ov[x.i + '_0'] = { paid: m.paid, st: 'claim', amt: a, note: n, method: $('#cm').value, img }; x.nt.unshift({ t: 'Tenant claimed ' + fmt(a) + ' paid via ' + $('#cm').value, n, by: x.t, at: '18 Nov 2026' }); closeM(); toast('Claim sent to admin for approval'); trender() };
            if (f) { const r = new FileReader(); r.onload = e => fin(e.target.result); r.readAsDataURL(f) } else fin(null)
        }
        function pimg(i) { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = e => { tn.img = e.target.result; toast('Profile photo updated'); trender() }; r.readAsDataURL(f) }
        function pwM() { modal(`<h3>Change password</h3><label>Current password</label><input id="p0" type="password"><label>New password</label><input id="p1" type="password"><label>Confirm new password</label><input id="p2" type="password"><p class="err" id="er"></p><button class="btn p" onclick="pwS()">Update password</button>`) }
        function pwS() { if (!$('#p0').value) return err('Enter your current password.'); if ($('#p1').value.length < 8) return err('Use at least 8 characters.'); if ($('#p1').value != $('#p2').value) return err('The new passwords do not match.'); closeM(); toast('Password updated') }
        function renewT() { modal(`<h3>Request renewal</h3><label>New agreement paper</label><input type="file"><label>Note to admin</label><textarea id="cn" rows="2"></textarea><button class="btn p" style="margin-top:14px" onclick="renewR()">Send request</button>`) }
        function renewR() { const x = byId(tn.ai); x.nt.unshift({ t: 'Tenant requested renewal', n: $('#cn').value.trim(), by: x.t, at: '18 Nov 2026' }); closeM(); toast('Renewal request sent to admin') }
        render();
    </script>
</body>
